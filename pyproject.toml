[project]
name = "gov-agentic"
version = "0.1.0"
description = "Gov Agentic pipeline with Langfuse observability"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "python-dotenv",
    "requests",
    "networkx>=3.6.1",
    "neo4j>=6.1.0",
    "pandas",
    "matplotlib",
    "matplotlib-inline",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
