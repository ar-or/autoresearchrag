[project]
name = "gov-agentic"
version = "0.1.0"
description = "Gov Agentic pipeline with Langfuse observability"
requires-python = ">=3.11"
dependencies = [
    "openai",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "python-dotenv",
    "requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
