services:
  eval:
    build: .
    working_dir: /home/rag
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      - ORAGENT_URL=http://localhost:32522
      - ELASTIC_URL=http://localhost:9200
    volumes:
      - .:/home/rag
      - ./data_as_files:/mnt/data:ro
      - ./codex_config.toml:/home/rag/.codex/config.toml:rw
      - ${HOME}/.codex/auth.json:/mnt/secrets/codex_auth.json:ro
      - ./github_deploy_key:/mnt/secrets/github_deploy_key:ro
      - ./.env:/app/.env:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
