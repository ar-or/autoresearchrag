services:
  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.1
    container_name: elastic
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - network.host=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - esdata:/usr/share/elasticsearch/data

  eval:
    build: .
    working_dir: /home/rag
    network_mode: host
    stdin_open: true
    tty: true
    depends_on:
      elastic:
        condition: service_healthy
    environment:
      - ORAGENT_URL=http://localhost:32522
      - ELASTIC_URL=http://localhost:9200
    volumes:
      - .:/home/rag
      - ./data_as_files:/mnt/data:ro
      - ./codex_config.toml:/home/rag/.codex/config.toml:rw
      - ${HOME}/.codex/auth.json:/root/.codex/auth.json:ro
      - ./github_deploy_key:/mnt/secrets/github_deploy_key:ro
      - ./.env:/app/.env:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  esdata:
